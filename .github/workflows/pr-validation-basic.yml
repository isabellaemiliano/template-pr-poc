name: Validação Básica de PR (Sem Comentários)

on:
  pull_request:
    types: [opened, edited, synchronize]
  workflow_dispatch:

permissions:
  pull-requests: read
  contents: read

jobs:
  validate-pr-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug PR Info
        run: |
          echo "=== DEBUG INFO ==="
          echo "Event: ${{ github.event_name }}"
          echo "PR Number: ${{ github.event.pull_request.number }}"
          echo "PR Title: ${{ github.event.pull_request.title }}"
          echo "PR Body Length: ${{ length(github.event.pull_request.body) }}"
          echo "=================="

      - name: Validate PR Template
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          
          echo "=== VALIDAÇÃO BÁSICA ==="
          echo "Tamanho do corpo: ${#PR_BODY} caracteres"
          
          # Verificar se o corpo não está vazio
          if [ -z "$PR_BODY" ]; then
            echo "❌ Corpo do PR está vazio"
            exit 1
          fi
          
          echo "✅ Corpo do PR não está vazio"
          
          # Detectar tipo de template
          if echo "$PR_BODY" | grep -q ":clipboard: Título da demanda"; then
            echo "📋 Template detectado: feature"
          elif echo "$PR_BODY" | grep -q ":beetle: Título da demanda"; then
            echo "📋 Template detectado: bug"
          else
            echo "❌ Template não reconhecido"
            exit 1
          fi
          
          # Verificar valores padrão
          if echo "$PR_BODY" | grep -i -q "lorem ipsum"; then
            echo "❌ Encontrado 'lorem ipsum' no corpo"
            exit 1
          fi
          
          if echo "$PR_BODY" | grep -q "MK-XXXX"; then
            echo "❌ Encontrado 'MK-XXXX' no corpo"
            exit 1
          fi
          
          echo "✅ Validação básica passou!"
          echo "✅ Template reconhecido"
          echo "✅ Nenhum valor padrão encontrado"

      - name: Success Output
        if: success()
        run: |
          echo "🎉 Workflow executado com sucesso!"
          echo "PR validado corretamente"

      - name: Failure Output
        if: failure()
        run: |
          echo "❌ Workflow falhou"
          echo "PR não passou na validação" 