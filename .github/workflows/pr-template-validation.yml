name: Valida Template do PR

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize # Executa quando novas mudanças são enviadas para o PR

permissions:
  pull-requests: write
  issues: write

jobs:
  validate_pr_template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Validar Template do PR
        id: validate
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          VALIDATION_STATUS="success"
          ERROR_MESSAGES=""
          COMMENT_BODY=""

          echo "--- Conteúdo do PR_BODY para depuração ---"
          echo "$PR_BODY"
          echo "--- Fim do PR_BODY ---"

          # --- Lógica para identificar qual template foi usado ---
          if echo "$PR_BODY" | grep -q ":beetle:"; then
            echo "Template de Incidente detectado."
            TEMPLATE_TYPE="incidente"
            REQUIRED_SECTIONS=(
              "**:fire: Resumo do incidente:**"
              "**:hammer_and_wrench: Causa Raiz:**"
              "**:wrench: Correção Realizada:**"
              "**:mechanic: Evidências de testes local:**"
            )
          elif echo "$PR_BODY" | grep -q ":clipboard:"; then
            echo "Template de Feature/Melhoria detectado."
            TEMPLATE_TYPE="feature"
            REQUIRED_SECTIONS=(
              "**:rocket: Visão Geral:**"
              "**:sparkles: Mudanças Implementadas:**"
              "**:mechanic: Evidências de testes local:**"
            )
          else
            echo "Nenhum template reconhecido. Por favor, utilize um dos templates padrão."
            VALIDATION_STATUS="failure"
            ERROR_MESSAGES+="* Nenhum template de PR reconhecido. Por favor, use o template de Incidente ou de Feature/Melhoria.\n"
            COMMENT_BODY+="## ❌ Validação do Template do PR Falhou!\n\n"
            COMMENT_BODY+="**Problema:** Nenhum template de PR foi reconhecido.\n\n"
            COMMENT_BODY+="**Solução:** Por favor, utilize um dos templates padrão:\n"
            COMMENT_BODY+="- Template de **Incidente** (deve conter \`:beetle:\`)\n"
            COMMENT_BODY+="- Template de **Feature/Melhoria** (deve conter \`:clipboard:\`)\n\n"
            COMMENT_BODY+="---\n"
            COMMENT_BODY+="*Este comentário foi gerado automaticamente pela validação de templates.*"
          fi

          # --- Lógica para validar se as seções obrigatórias estão preenchidas ---
          if [ "$VALIDATION_STATUS" = "success" ]; then
            COMMENT_BODY+="## ❌ Validação do Template do PR Falhou!\n\n"
            COMMENT_BODY+="**Template detectado:** $TEMPLATE_TYPE\n\n"
            COMMENT_BODY+="**Problemas encontrados:**\n\n"
            
            for SECTION in "${REQUIRED_SECTIONS[@]}"; do
              echo "Verificando seção: '$SECTION'"

              # Escapa caracteres especiais para o grep
              ESCAPED_SECTION=$(echo "$SECTION" | sed 's/[][\/.^$*+?(){}|-]/\\&/g')

              # Encontra a linha que contém a seção
              SECTION_LINE=$(echo "$PR_BODY" | grep -n "^$ESCAPED_SECTION" | head -1 | cut -d: -f1)
              
              if [ -z "$SECTION_LINE" ]; then
                echo "Seção '$SECTION' não encontrada no PR."
                VALIDATION_STATUS="failure"
                ERROR_MESSAGES+="* A seção **${SECTION}** não foi encontrada no PR.\n"
                COMMENT_BODY+="### 🔍 **${SECTION}**\n"
                COMMENT_BODY+="**Status:** ❌ **Não encontrada**\n\n"
                COMMENT_BODY+="**Problema:** Esta seção obrigatória não foi encontrada no PR.\n\n"
                COMMENT_BODY+="**Solução:** Adicione esta seção ao seu PR seguindo o template padrão.\n\n"
                continue
              fi

              # Extrai o conteúdo após a linha da seção até a próxima seção ou fim
              SECTION_CONTENT=$(echo "$PR_BODY" | awk -v section_line="$SECTION_LINE" '
                NR > section_line {
                  if ($0 ~ /^####/ || $0 ~ /^\*\*:/) exit
                  if ($0 !~ /^[[:space:]]*$/) {
                    gsub(/^[[:space:]]+|[[:space:]]+$/, "")
                    if (content != "") content = content " "
                    content = content $0
                  }
                }
                END { print content }
              ')

              echo "Conteúdo encontrado para '$SECTION': '$SECTION_CONTENT'"

              # Verifica se o conteúdo está vazio ou contém o placeholder
              if [ -z "$SECTION_CONTENT" ] || \
                 echo "$SECTION_CONTENT" | grep -q "lorem ipsum dolor sit amet consectetur adipisicing elit" || \
                 [ -z "$(echo "$SECTION_CONTENT" | tr -d '[:space:]')" ]; then
                echo "Seção '$SECTION' está vazia ou contém placeholder."
                VALIDATION_STATUS="failure"
                ERROR_MESSAGES+="* A seção **${SECTION}** está vazia ou ainda contém o texto de placeholder.\n"
                COMMENT_BODY+="### 🔍 **${SECTION}**\n"
                COMMENT_BODY+="**Status:** ❌ **Vazia ou com placeholder**\n\n"
                COMMENT_BODY+="**Problema:** Esta seção está vazia ou ainda contém o texto de placeholder.\n\n"
                COMMENT_BODY+="**Conteúdo atual:** \`$SECTION_CONTENT\`\n\n"
                COMMENT_BODY+="**Solução:** Preencha esta seção com informações relevantes sobre sua mudança.\n\n"
              else
                COMMENT_BODY+="### ✅ **${SECTION}**\n"
                COMMENT_BODY+="**Status:** ✅ **Válida**\n\n"
              fi
            done
            
            COMMENT_BODY+="---\n"
            COMMENT_BODY+="*Este comentário foi gerado automaticamente pela validação de templates.*"
          fi

          # --- Saída da validação ---
          if [ "$VALIDATION_STATUS" = "failure" ]; then
            echo "::error::Validação do Template do PR Falhou!"
            echo "$ERROR_MESSAGES"
            
            # Salva o comentário para usar no próximo step
            echo "comment_body<<EOF" >> $GITHUB_OUTPUT
            echo "$COMMENT_BODY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            
            exit 1 # Falha a Action se a validação falhar
          else
            echo "::notice::Validação do Template do PR bem-sucedida!"
          fi

      - name: Comentar no PR se a validação falhou
        if: failure() && steps.validate.outputs.comment_body != ''
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const comment = `${{ steps.validate.outputs.comment_body }}`;
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
              
              console.log('✅ Comentário postado com sucesso no PR');
            } catch (error) {
              console.error('❌ Erro ao postar comentário:', error.message);
              console.error('Status:', error.status);
              console.error('Response:', error.response?.data);
            }
