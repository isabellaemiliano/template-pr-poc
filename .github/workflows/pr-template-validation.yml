name: Valida Template do PR

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize # Executa quando novas mudanças são enviadas para o PR

jobs:
  validate_pr_template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Validar Template do PR
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          VALIDATION_STATUS="success"
          ERROR_MESSAGES=""

          echo "--- Conteúdo do PR_BODY para depuração ---"
          echo "$PR_BODY"
          echo "--- Fim do PR_BODY ---"

          # --- Lógica para identificar qual template foi usado ---
          if echo "$PR_BODY" | grep -q ":beetle: Título da demanda"; then
            echo "Template de Incidente detectado."
            TEMPLATE_TYPE="incidente"
            REQUIRED_SECTIONS=(
              "**:fire: Resumo do incidente**"
              "**:hammer_and_wrench: Causa Raiz**"
              "**:wrench: Correção Realizada**"
              "**:mechanic: Evidências de testes local:**"
            )
          elif echo "$PR_BODY" | grep -q ":clipboard: Título da demanda"; then
            echo "Template de Feature/Melhoria detectado."
            TEMPLATE_TYPE="feature"
            REQUIRED_SECTIONS=(
              "#### **:rocket: Visão Geral**"
              "#### **:sparkles: Mudanças Implementadas**"
              "**:mechanic: Evidências de testes local:**"
            )
          else
            echo "Nenhum template reconhecido. Por favor, utilize um dos templates padrão."
            VALIDATION_STATUS="failure"
            ERROR_MESSAGES+="* Nenhum template de PR reconhecido. Por favor, use o template de Incidente ou de Feature/Melhoria.\n"
          fi

          # --- Lógica para validar se as seções obrigatórias estão preenchidas ---
          if [ "$VALIDATION_STATUS" = "success" ]; then
            # Padrões para identificar o início de uma nova seção (Markdown headers ou bold com emoji)
            # ou o início de uma observação. Isso serve para delimitar o fim da seção atual.
            NEXT_SECTION_PATTERN="^#+|^\\*\\*:|^>"

            for SECTION in "${REQUIRED_SECTIONS[@]}"; do
              echo "Verificando seção: '$SECTION'"

              # Escapa caracteres especiais para o sed
              ESCAPED_SECTION=$(echo "$SECTION" | sed 's/[][\/.^$*+?(){}|-]/\\&/g')

              # Usa sed para extrair o conteúdo entre a SECTION e o NEXT_SECTION_PATTERN
              # O sed funciona assim:
              # 1. Encontra a linha que começa com ESCAPED_SECTION
              # 2. Imprime tudo até a linha que corresponde a NEXT_SECTION_PATTERN (sem incluir esta última)
              # 3. 'd' para deletar as linhas que não estamos interessados
              # 4. 'q' para sair após encontrar o padrão, evitando processar o resto do arquivo desnecessariamente
              SECTION_CONTENT=$(echo "$PR_BODY" | \
                sed -n "/^$ESCAPED_SECTION/,/^$NEXT_SECTION_PATTERN/{//!p; /^$NEXT_SECTION_PATTERN/q}" | \
                sed '$d' | # Remove a última linha se ela for o próximo cabeçalho
                sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | # Remove espaços em branco no início e fim
                grep -v '^\s*$' | # Remove linhas que contêm apenas espaços em branco
                tr -d '\n' | # Remove todas as quebras de linha
                sed 's/^[[:space:]]*//;s/[[:space:]]*$//' # Remove espaços em branco no início e fim novamente
              )

              echo "Conteúdo encontrado para '$SECTION': '$SECTION_CONTENT'"

              # Verifica se o conteúdo está vazio ou contém o placeholder
              if [ -z "$SECTION_CONTENT" ] || \
                 [[ "$SECTION_CONTENT" =~ ^[[:space:]]*lorem ipsum dolor sit amet consectetur adipisicing elit[[:space:]]*$ ]] || \
                 [[ "$SECTION_CONTENT" =~ ^[[:space:]]*$ ]]; then
                echo "Seção '$SECTION' está vazia ou contém placeholder."
                VALIDATION_STATUS="failure"
                ERROR_MESSAGES+="* A seção **${SECTION}** está vazia ou ainda contém o texto de placeholder.\n"
              fi
            done
          fi

          # --- Saída da validação ---
          if [ "$VALIDATION_STATUS" = "failure" ]; then
            echo "::error::Validação do Template do PR Falhou!"
            # As saídas set-output foram removidas pois são depreciadas e não são mais necessárias para falhar a action
            exit 1 # Falha a Action se a validação falhar
          else
            echo "::notice::Validação do Template do PR bem-sucedida!"
          fi
