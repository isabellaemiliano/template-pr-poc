name: Teste de Validação de PR

on:
  pull_request:
    types: [opened, edited, synchronize]
  workflow_dispatch:

permissions:
  pull-requests: read
  contents: read

jobs:
  test-pr-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug Environment
        run: |
          echo "=== DEBUG INFO ==="
          echo "Event type: ${{ github.event_name }}"
          echo "PR number: ${{ github.event.pull_request.number }}"
          echo "PR title: ${{ github.event.pull_request.title }}"
          echo "PR body length: ${{ length(github.event.pull_request.body) }}"
          echo "PR body preview: ${{ github.event.pull_request.body }}"
          echo "=================="

      - name: Test Simple Validation
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          
          echo "=== VALIDAÇÃO SIMPLES ==="
          
          if [ -z "$PR_BODY" ]; then
            echo "❌ Corpo do PR está vazio"
            exit 1
          fi
          
          echo "✅ Corpo do PR não está vazio"
          echo "Tamanho: ${#PR_BODY} caracteres"
          
          if echo "$PR_BODY" | grep -q "lorem ipsum"; then
            echo "❌ Encontrado lorem ipsum no corpo"
            exit 1
          fi
          
          if echo "$PR_BODY" | grep -q "MK-XXXX"; then
            echo "❌ Encontrado MK-XXXX no corpo"
            exit 1
          fi
          
          echo "✅ Validação básica passou"
          
      - name: Success Message
        if: success()
        run: |
          echo "🎉 Workflow de teste executado com sucesso!"

      - name: Failure Message
        if: failure()
        run: |
          echo "❌ Workflow de teste falhou" 